version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fledgeportal-backend
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "8005:8005"
      - "8006:8006"
      - "8009:8009"
    environment:
      - MONGODB_URL_1=${MONGODB_URL_1:-${MONGODB_URL}}
      - MONGODB_URL_2=${MONGODB_URL_2:-${MONGODB_URL}}
      - MONGODB_URL_3=${MONGODB_URL_3:-${MONGODB_URL}}
      - MONGODB_URL_4=${MONGODB_URL_4:-${MONGODB_URL}}
      - MONGODB_URL_5=${MONGODB_URL_5:-${MONGODB_URL}}
      - MONGODB_URL_6=${MONGODB_URL_6:-${MONGODB_URL}}
      - MONGODB_URL_7=${MONGODB_URL_7:-${MONGODB_URL}}
      - MONGODB_URL_8=${MONGODB_URL_8:-${MONGODB_URL}}
      - SECRET_KEY=${SECRET_KEY:-fledge_portal_super_secret_key_change_in_production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: fledgeportal-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ATTENDANCE_API_URL=http://localhost:8002
      - NEXT_PUBLIC_TEST_API_URL=http://localhost:8003
      - NEXT_PUBLIC_MATERIALS_API_URL=http://localhost:8005
      - NEXT_PUBLIC_VIDEO_API_URL=http://localhost:8006
      - NEXT_PUBLIC_COMMUNITY_API_URL=http://localhost:8009
    depends_on:
      - backend
    restart: unless-stopped
